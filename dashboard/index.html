<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial AI Platform</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e1a; color: #e2e8f0; font-family: 'SF Mono', 'Fira Code', monospace; }
  .app { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; height: 100vh; gap: 1px; background: #1a2035; }
  .header { grid-column: 1/-1; background: #0d1117; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e3a5f; }
  .header h1 { font-size: 16px; font-weight: 600; color: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
  .badge { background: #0f3460; color: #38bdf8; padding: 4px 10px; border-radius: 4px; font-size: 11px; border: 1px solid #1e5f8e; }
  .panel { background: #0d1117; padding: 20px; overflow-y: auto; }
  .panel-title { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
  .signal-card { background: #111827; border: 1px solid #1e293b; border-radius: 6px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s; }
  .signal-card:hover { border-color: #38bdf8; }
  .signal-card.bullish { border-left: 3px solid #10b981; }
  .signal-card.bearish { border-left: 3px solid #ef4444; }
  .signal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .symbol { font-size: 14px; font-weight: 700; color: #f1f5f9; }
  .date { font-size: 11px; color: #475569; }
  .signal-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
  .stat { background: #0a0e1a; border-radius: 4px; padding: 6px 8px; }
  .stat-label { font-size: 9px; color: #475569; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 12px; color: #e2e8f0; margin-top: 2px; }
  .stat-value.green { color: #10b981; }
  .stat-value.red { color: #ef4444; }
  .stat-value.blue { color: #38bdf8; }
  .ml-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 3px; font-size: 10px; margin-top: 8px; }
  .ml-badge.strong { background: #052e16; color: #10b981; border: 1px solid #166534; }
  .ml-badge.normal { background: #0f172a; color: #64748b; border: 1px solid #1e293b; }
  .chat-panel { display: flex; flex-direction: column; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px 0; }
  .message { margin-bottom: 16px; }
  .message.user .bubble { background: #1e3a5f; border-radius: 6px 6px 0 6px; margin-left: auto; max-width: 80%; padding: 10px 14px; font-size: 13px; color: #bae6fd; }
  .message.assistant .bubble { background: #111827; border: 1px solid #1e293b; border-radius: 6px 6px 6px 0; max-width: 90%; padding: 12px 14px; font-size: 13px; line-height: 1.6; color: #e2e8f0; white-space: pre-wrap; }
  .chat-input { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #1e293b; }
  .chat-input input { flex: 1; background: #111827; border: 1px solid #1e293b; border-radius: 4px; padding: 10px 14px; color: #e2e8f0; font-family: inherit; font-size: 13px; outline: none; }
  .chat-input input:focus { border-color: #38bdf8; }
  .chat-input button { background: #1e3a5f; color: #38bdf8; border: 1px solid #1e5f8e; border-radius: 4px; padding: 10px 18px; cursor: pointer; font-family: inherit; font-size: 13px; }
  .chat-input button:hover { background: #2d5a8e; }
  .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
  .loading { color: #475569; font-size: 12px; padding: 8px 0; }
  .quick-btn { background: #0f172a; border: 1px solid #1e293b; border-radius: 4px; padding: 6px 12px; font-size: 11px; color: #64748b; cursor: pointer; margin: 4px 4px 4px 0; font-family: inherit; }
  .quick-btn:hover { border-color: #38bdf8; color: #38bdf8; }
  .prob-bar { height: 3px; background: #1e293b; border-radius: 2px; margin-top: 6px; }
  .prob-fill { height: 100%; border-radius: 2px; background: #38bdf8; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid #1e293b; margin-bottom: 16px; }
  .tab { padding: 8px 16px; font-size: 11px; color: #475569; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 1px; }
  .tab.active { color: #38bdf8; border-bottom-color: #38bdf8; }
  .forecast-card { background: #111827; border: 1px solid #1e293b; border-radius: 6px; padding: 14px; margin-bottom: 10px; }
  .forecast-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #0a0e1a; font-size: 12px; }
  .forecast-row:last-child { border-bottom: none; }
  .symbol-select { background: #111827; border: 1px solid #1e293b; border-radius: 4px; padding: 8px 12px; color: #e2e8f0; font-family: inherit; font-size: 12px; width: 100%; margin-bottom: 12px; }
  .range-bar { height: 4px; background: #1e293b; border-radius: 2px; margin-top: 4px; position: relative; }
  .range-fill { height: 100%; border-radius: 2px; background: #38bdf8; position: absolute; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const API = "http://localhost:8000";

const QUICK_QUESTIONS = [
  "Which symbols had the highest percentage change?",
  "Which stocks were bullish with high volume?",
  "What was NVDA doing recently?",
  "Which symbols look most volatile?",
];

function SignalCard({ signal }) {
  const bullish = signal.avg_pct_change > 0;
  return (
    <div className={"signal-card " + (bullish ? "bullish" : "bearish")}>
      <div className="signal-header">
        <span className="symbol">{signal.symbol}</span>
        <span className="date">{signal.trade_date}</span>
      </div>
      <div className="signal-stats">
        <div className="stat">
          <div className="stat-label">Change</div>
          <div className={"stat-value " + (bullish ? "green" : "red")}>
            {bullish ? "+" : ""}{signal.avg_pct_change && signal.avg_pct_change.toFixed(4)}%
          </div>
        </div>
        <div className="stat">
          <div className="stat-label">Volume</div>
          <div className={"stat-value " + (signal.avg_volume > 1000000 ? "blue" : "")}>
            {signal.avg_volume && (signal.avg_volume / 1000).toFixed(0)}K
          </div>
        </div>
        <div className="stat">
          <div className="stat-label">Range</div>
          <div className="stat-value">
            ${signal.day_low && signal.day_low.toFixed(0)}-${signal.day_high && signal.day_high.toFixed(0)}
          </div>
        </div>
      </div>
      {signal.probability !== undefined && (
        <div>
          <div className={"ml-badge " + (signal.prediction === "strong move expected" ? "strong" : "normal")}>
            ML: {(signal.probability * 100).toFixed(0)}% {signal.prediction}
          </div>
          <div className="prob-bar">
            <div className="prob-fill" style={{width: (signal.probability * 100) + "%"}}></div>
          </div>
        </div>
      )}
    </div>
  );
}

function ForecastPanel() {
  const [symbols, setSymbols] = React.useState([]);
  const [selected, setSelected] = React.useState("NVDA");
  const [forecasts, setForecasts] = React.useState([]);
  const [loading, setLoading] = React.useState(false);

  React.useEffect(function() {
    fetch(API + "/api/forecast-symbols")
      .then(function(r) { return r.json(); })
      .then(function(data) { setSymbols(data); });
  }, []);

  React.useEffect(function() {
    if (!selected) return;
    setLoading(true);
    fetch(API + "/api/forecasts/" + selected)
      .then(function(r) { return r.json(); })
      .then(function(data) { setForecasts(data); setLoading(false); });
  }, [selected]);

  const minPrice = forecasts.length ? Math.min.apply(null, forecasts.map(function(f) { return f.lower_bound || 0; })) : 0;
  const maxPrice = forecasts.length ? Math.max.apply(null, forecasts.map(function(f) { return f.upper_bound || 0; })) : 0;

  return (
    <div>
      <select className="symbol-select" value={selected} onChange={function(e) { setSelected(e.target.value); }}>
        {symbols.map(function(s) { return <option key={s} value={s}>{s}</option>; })}
      </select>
      {loading && <div className="loading">Loading forecast...</div>}
      {forecasts.length > 0 && (
        <div className="forecast-card">
          <div style={{fontSize: 11, color: "#64748b", marginBottom: 12}}>
            Prophet 7-day forecast - trained on 1yr daily bars
          </div>
          {forecasts.map(function(f, i) {
            const bullish = f.trend === "bullish";
            const rangeWidth = maxPrice - minPrice;
            const fillLeft = rangeWidth > 0 ? ((f.lower_bound - minPrice) / rangeWidth * 100) : 0;
            const fillWidth = rangeWidth > 0 ? ((f.upper_bound - f.lower_bound) / rangeWidth * 100) : 0;
            return (
              <div key={i} className="forecast-row">
                <span style={{color: "#475569", minWidth: 80}}>{f.forecast_date}</span>
                <span style={{color: bullish ? "#10b981" : "#ef4444", minWidth: 20}}>{bullish ? "▲" : "▼"}</span>
                <span style={{color: "#e2e8f0", minWidth: 70}}>${f.predicted_close && f.predicted_close.toFixed(2)}</span>
                <div style={{flex: 1, marginLeft: 12}}>
                  <div style={{fontSize: 10, color: "#475569"}}>
                    ${f.lower_bound && f.lower_bound.toFixed(0)} - ${f.upper_bound && f.upper_bound.toFixed(0)}
                  </div>
                  <div className="range-bar">
                    <div className="range-fill" style={{left: fillLeft + "%", width: fillWidth + "%"}}></div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App() {
  const [signals, setSignals] = React.useState([]);
  const [messages, setMessages] = React.useState([
    {role: "assistant", text: "Welcome to Financial AI Platform. Ask me about market signals, volume patterns, and ML predictions."}
  ]);
  const [input, setInput] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [loadingSignals, setLoadingSignals] = React.useState(true);
  const [activeTab, setActiveTab] = React.useState("signals");
  const messagesEndRef = React.useRef(null);

  React.useEffect(function() {
    fetch(API + "/api/signals")
      .then(function(r) { return r.json(); })
      .then(function(data) { setSignals(data); setLoadingSignals(false); })
      .catch(function() { setLoadingSignals(false); });
  }, []);

  React.useEffect(function() {
    if (messagesEndRef.current) {
      messagesEndRef.current.scrollIntoView({behavior: "smooth"});
    }
  }, [messages]);

  function ask(question) {
    if (!question.trim() || loading) return;
    setMessages(function(m) { return m.concat([{role: "user", text: question}]); });
    setInput("");
    setLoading(true);
    fetch(API + "/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: question})
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        setMessages(function(m) { return m.concat([{role: "assistant", text: data.answer}]); });
        setLoading(false);
      })
      .catch(function() {
        setMessages(function(m) { return m.concat([{role: "assistant", text: "Error connecting to backend."}]); });
        setLoading(false);
      });
  }

  return (
    <div className="app">
      <div className="header">
        <h1>Financial AI Platform</h1>
        <div style={{display: "flex", gap: 8}}>
          <span className="badge">135 Symbols</span>
          <span className="badge">Prophet Forecasts</span>
          <span className="badge">Claude RAG</span>
        </div>
      </div>

      <div className="panel">
        <div className="tabs">
          <div className={"tab " + (activeTab === "signals" ? "active" : "")} onClick={function() { setActiveTab("signals"); }}>
            Live Signals
          </div>
          <div className={"tab " + (activeTab === "forecast" ? "active" : "")} onClick={function() { setActiveTab("forecast"); }}>
            7-Day Forecast
          </div>
        </div>

        {activeTab === "signals" && (
          <div>
            <div className="panel-title">{signals.length} signals from BigQuery</div>
            {loadingSignals && <div className="loading">Loading...</div>}
            {signals.map(function(s, i) { return <SignalCard key={i} signal={s} />; })}
          </div>
        )}

        {activeTab === "forecast" && (
          <div>
            <div className="panel-title">Prophet ML Forecast</div>
            <ForecastPanel />
          </div>
        )}
      </div>

      <div className="panel chat-panel">
        <div className="panel-title">AI Market Analyst - RAG + ML</div>
        <div className="chat-messages">
          {messages.map(function(m, i) {
            return (
              <div key={i} className={"message " + m.role}>
                <div className="bubble">{m.text}</div>
              </div>
            );
          })}
          {loading && <div className="loading">Analyzing...</div>}
          <div ref={messagesEndRef}></div>
        </div>
        <div style={{marginBottom: 8}}>
          {QUICK_QUESTIONS.map(function(q, i) {
            return <button key={i} className="quick-btn" onClick={function() { ask(q); }}>{q}</button>;
          })}
        </div>
        <div className="chat-input">
          <input
            value={input}
            onChange={function(e) { setInput(e.target.value); }}
            onKeyDown={function(e) { if (e.key === "Enter") ask(input); }}
            placeholder="Ask about market signals..."
          />
          <button onClick={function() { ask(input); }} disabled={loading}>Send</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
